plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nandhupickles.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.nandhupickles.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
